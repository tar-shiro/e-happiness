name: gallery-job

# Reference copy of the workflow that runs on the live repo
# (tar-shiro/scriptupptime). Triggered by the worker's repository_dispatch
# (POST /api/gallery/jobs → api.github.com/repos/{owner}/{repo}/dispatches).
on:
  repository_dispatch:
    types: [gallery-job-trigger]

jobs:
  run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The Pixiv refresh token is NOT passed here — job_script.py reads it
      # once from D1 job_tokens (keyed by the dispatch payload jobId) and
      # deletes it. CF_* secrets only touch the operator's own D1.
      - name: Run gallery job
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DB_ID: ${{ secrets.CF_D1_DB_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python job_script.py
